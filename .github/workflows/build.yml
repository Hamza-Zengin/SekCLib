name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Inspect GameTest API
        run: |
          ./gradlew compileJava
          JARS=$(find ~/.gradle/caches/modules-2 build -name '*26.3*.jar' 2>/dev/null | tr '\n' ':')
          javap -cp "$JARS" net.minecraft.gametest.framework.GameTestHelper net.minecraft.gametest.framework.TestEnvironmentDefinition\$AllOf net.minecraft.core.registries.Registries | grep -E "Compiled from|class |interface |succeed|fail|assert|makeMock|Player|runAfter|AllOf|TEST_FUNCTION|TEST_INSTANCE" || true

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build -PisRelease=true

      - name: Upload Playable Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-0.1.0
          path: |
            build/libs/SekCLib-*.jar
            !build/libs/*-sources.jar

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-0.1.0-sources
          path: |
            build/libs/*-sources.jar
