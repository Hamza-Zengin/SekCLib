name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build -PisRelease=true

      - name: Upload Playable Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-1.20.1-1.1.0
          path: |
            build/libs/SekCLib-*.jar
            !build/libs/*-deobf.jar
            !build/libs/*-sources.jar

      - name: Upload Dev & Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-1.20.1-1.1.0-dev
          path: |
            build/libs/*-deobf.jar
            build/libs/*-sources.jar
