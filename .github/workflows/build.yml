name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Run Tests
        run: ./gradlew test

      - name: Run GameTests
        run: ./gradlew runGameTestServer

      - name: Build with Gradle
        run: ./gradlew build -PisRelease=true

      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(tr -d '[:space:]' < version.txt)
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" -u "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
            "https://maven.pkg.github.com/hamza-zengin/sekclib/com/sekwah/sekclib/${VERSION}/sekclib-${VERSION}.pom")
          if [ "$STATUS" = "200" ]; then
            echo "SekCLib ${VERSION} is already published to GitHub Packages; skipping."
          else
            ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository -PisRelease=true
          fi

      - name: Upload Playable Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-0.1.0
          path: |
            build/libs/SekCLib-*.jar
            !build/libs/*-sources.jar

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-0.1.0-sources
          path: |
            build/libs/*-sources.jar
