name: Build and Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25

      - name: Inspect GameTest API
        run: |
          ./gradlew --init-script <(echo 'allprojects { afterEvaluate { tasks.register("printCp") { doLast { println configurations.compileClasspath.asPath } } } }') printCp -q > cp.txt
          CP=$(tail -1 cp.txt)
          javap -cp "$CP" net.neoforged.neoforge.event.RegisterGameTestsEvent net.minecraft.gametest.framework.GameTestHelper net.minecraft.gametest.framework.FunctionGameTestInstance net.minecraft.gametest.framework.TestData net.minecraft.gametest.framework.GameTestInstance net.minecraft.gametest.framework.TestEnvironmentDefinition || true

      - name: Run Tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build -PisRelease=true

      - name: Upload Playable Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-0.1.0
          path: |
            build/libs/SekCLib-*.jar
            !build/libs/*-sources.jar

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SekCLib-0.1.0-sources
          path: |
            build/libs/*-sources.jar
