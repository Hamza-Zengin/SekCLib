modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/Hamza-Zengin/SekCLib/issues"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://github.com/Hamza-Zengin/SekCLib"
    authors="${mod_authors}"
    description='''A library mod designed to make aspects of modding easier, in particular network syncing with clients.

Other features and utilities are also included.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

# https://maven.apache.org/enforcer/enforcer-rules/versionRanges.html
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
