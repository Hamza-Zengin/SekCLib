import java.net.URI
import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.time.OffsetDateTime
import java.time.format.DateTimeFormatter

plugins {
    id 'java-library'
    id 'eclipse'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

def branch = System.getenv("GITHUB_REF")
def snapshotName = null
if (branch != null) {
    branch = branch.replace('refs/heads/', '').replace('/', '-')
}
def isRelease = System.getenv("IS_RELEASE") == "true" || (project.hasProperty("isRelease") && project.property("isRelease") == "true") || System.getProperty("isRelease") == "true"

snapshotName = (branch == null || branch.startsWith("release-please")) ? "SNAPSHOT" : branch
def githubSha = System.getenv("GITHUB_SHA")
def shaRef = githubSha != null ? "-${githubSha.substring(0, 8)}" : ""

println "Branch ${branch}${shaRef} isRelease: '${isRelease}'"

// Get version from file managed by release-please
def versionString = (file('./version.txt').text.trim() + (isRelease ? "" : "-${snapshotName}${shaRef}"))
setVersion(versionString)
println "Version: ${getVersion()}"

group = project.package // http://maven.apache.org/guides/mini/guide-naming-conventions.html

base {
    archivesName = "${project.archive}${project.mc_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.modid, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.modid}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${project.modid}"
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : project.property('minecraft_version'),
            minecraft_version_range: project.property('minecraft_version_range'),
            neo_version            : project.property('neo_version'),
            neo_version_range      : project.property('neo_version_range'),
            loader_version_range   : project.property('loader_version_range'),
            mod_id                 : project.property('modid'),
            mod_name               : project.property('title'),
            mod_license            : project.property('mod_license'),
            mod_version            : versionString,
            mod_authors            : project.property('mod_authors')
    ]
    inputs.properties(replaceProperties)

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(replaceProperties)
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"   : project.modid,
                "Specification-Vendor"  : project.vendor,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.name,
                "Implementation-Version": "${versionString}",
                "Implementation-Vendor" : project.vendor,
                "Implementation-Timestamp": OffsetDateTime.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd'T'HH:mm:ssZ")),
        ])
    }
}

def srcJar = tasks.register('srcJar', Jar) {
    from sourceSets.main.allSource
    archiveClassifier = 'sources'
    from file("LICENSE")
}

tasks.named('assemble').configure {
    dependsOn(srcJar)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact tasks.named('jar')
            artifact srcJar
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/Hamza-Zengin/SekCLib")
            credentials {
                username = System.getenv("GITHUB_ACTOR") ?: project.findProperty("gpr.user") ?: ""
                password = System.getenv("GITHUB_TOKEN") ?: project.findProperty("gpr.key") ?: ""
            }
        }
        mavenLocal()
    }
}

def getReleaseChangelog() {
    def changelogFile = file('CHANGELOG.md')
    def changelog = "## [${changelogFile.text.split('\n## \\[')[1]}\n\n"
    return changelog
}

/**
 * For pre-releases and testers to be able to try the latest commits if they want.
 * If the builds start exceeding 8MB then we may want to upload to s3 instead and periodically clear.
 */
tasks.register('discordupload') {
    dependsOn(tasks.named('jar'))
    doLast {
        String discordWebhook = System.getenv("DISCORD_WEBHOOK")

        if (discordWebhook != null) {
            String content = !isRelease
                    ? "New snapshot or testing build"
                    : "New release build\n```markdown\n${getReleaseChangelog()}\n```"

            def jarTask = tasks.named('jar', Jar).get()
            def jarPath = jarTask.archiveFile.get().asFile.toPath()
            def jarName = jarPath.fileName.toString()

            String boundary = "----SekCLibBoundary${System.currentTimeMillis()}"
            def byteOut = new ByteArrayOutputStream()
            byteOut.write(("--${boundary}\r\n" +
                    "Content-Disposition: form-data; name=\"content\"\r\n\r\n" +
                    "${content}\r\n" +
                    "--${boundary}\r\n" +
                    "Content-Disposition: form-data; name=\"file\"; filename=\"${jarName}\"\r\n" +
                    "Content-Type: application/java-archive\r\n\r\n").getBytes(StandardCharsets.UTF_8))
            byteOut.write(Files.readAllBytes(jarPath))
            byteOut.write("\r\n--${boundary}--\r\n".getBytes(StandardCharsets.UTF_8))

            def client = HttpClient.newHttpClient()
            def request = HttpRequest.newBuilder()
                    .uri(URI.create(discordWebhook))
                    .header("Content-Type", "multipart/form-data; boundary=${boundary}")
                    .POST(HttpRequest.BodyPublishers.ofByteArray(byteOut.toByteArray()))
                    .build()

            def response = client.send(request, HttpResponse.BodyHandlers.ofString())
            println("Posted build (HTTP ${response.statusCode()})")
        } else {
            println("Discord webhook unspecified")
        }
    }
}

if (plugins.hasPlugin("com.matthewprenger.cursegradle")) {
    tasks.curseforge.enabled = System.getenv("CURSE_API") != null

    curseforge {
        logger.info("Curse api: " + System.getenv("CURSE_API"))
        if (System.getenv("CURSE_API") != null) {
            apiKey = System.getenv("CURSE_API")
        }
        project {
            id = project.curse_project_id
            changelog = getReleaseChangelog()
            changelogType = 'markdown'
            releaseType = 'release'
            addGameVersion '26.3'

            mainArtifact(tasks.named('jar').get()) {
            }
            addArtifact srcJar.get()
        }
    }
}

// https://github.com/modrinth/minotaur
if (plugins.hasPlugin("com.modrinth.minotaur")) {
    modrinth {
        token = System.getenv("MODRINTH_TOKEN")
        projectId = project.modrinth_slug
        versionType = "release"
        uploadFile = tasks.named('jar')
        additionalFiles = [srcJar]
        gameVersions = ["26.3"]
        changelog = getReleaseChangelog()
    }
}
